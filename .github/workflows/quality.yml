name: Development quality

on:
  pull_request:
    branches: [main]
  push:
    tags: ['[0-9]*.[0-9]*.[0-9]*', 'v[0-9]*.[0-9]*.[0-9]*']

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  foundation:
    if: github.event_name != 'push' || !github.event.deleted
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Determine build eligibility
        id: eligibility
        env:
          SOULKILLER_CI_EVENT: ${{ github.event_name }}
          SOULKILLER_CI_BASE: ${{ github.event.pull_request.base.ref }}
          SOULKILLER_CI_REF: ${{ github.ref }}
          SOULKILLER_CI_REF_TYPE: ${{ github.ref_type }}
          SOULKILLER_CI_DELETED: ${{ github.event.deleted || false }}
        run: node tools/checks/ci-policy-cli.mjs >> "$GITHUB_OUTPUT"
      - name: Build the development environment
        if: steps.eligibility.outputs.eligible == 'true'
        run: docker build --tag soulkiller-quality .devcontainer
      - name: Run canonical credential-free checks
        if: steps.eligibility.outputs.eligible == 'true'
        env:
          SOULKILLER_CHECK_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: >-
          docker run --rm --init
          --mount "type=bind,source=${GITHUB_WORKSPACE},target=/workspaces/soulkiller,readonly"
          --env SOULKILLER_CHECK_BASE
          soulkiller-quality bash tools/checks/check.sh all
