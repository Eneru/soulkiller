schema: spec-driven

context: |
  Soulkiller is a multi-stage application project inspired by Cyberpunk 2077.
  Functional stages and architecture still need to be defined with the maintainer.
  Source-machine priority: Windows on an ordinary household PC; exact hardware is open.
  Read docs/research/soulkiller-decisions.md for confirmed answers and pending choices.
  The desk study was reviewed and merged in PR #4; recommendations do not adopt a stack.
  Confirmed first inputs: TXT and born-digital PDF, French and English.
  Initial corpus profile: tens to hundreds of documents, approximately 1,000 pages; not a tested capacity.
  Confirmed presentation: first-person text dialogue with consultable sources; citation interaction details remain open.
  Compare local and remote before deciding; no data egress or paid trial is authorized.
  Persona memories are proposed and saved automatically, inspectable and deletable.
  Saved memories are used immediately with conversational origin; shared across interlocutors of one persona.
  Memories contain explicit interlocutor statements and faithful attributed summaries, not inferred preferences.
  Deletion removes the memory and derivatives, retains history and uses a technical trace to prevent automatic regeneration.
  Trace design, management rights, conflicts/correction, style evolution, retention, backups and remote deletion remain open.
  Read docs/research/soulkiller-first-increment-framing.md before behavioral specifications.
  The foundation uses Ubuntu 24.04, Node.js and OpenSpec in a non-root devcontainer.
  Python, .NET, Angular and OmniRoute are candidates, not adopted technologies.
  Run all development and validation commands inside the container.
  Only building and launching the container are allowed on the host.
  Do not modify or mount host folders other than Soulkiller.
  GitHub Flow: branch from main, validated ready-for-review PR, human review, manual merge.
  Draft PRs are only for unfinished work with a useful portion for early reading; identify remaining work.
  Historical draft-delivery records do not override the current policy.
  Keep LICENSE unchanged. No secrets or automatic paid LLM calls.
  DevOps/DevSecOps accompanies each implemented component; minimum 70% test coverage.
  Read docs/development-quality.md: Gitleaks, Hadolint, applicable language analysis and web ZAP.
  Plan Gitleaks in repository-local pre-commit hooks and Hadolint editor integration using an image-installed binary.
  Specify execution points for container commands, hooks, editor diagnostics and CI; do not modify host/global configuration.
  Plan reproducible benchmarks and bounded load tests with synthetic data, approved profiles and thresholds.
  Run CI builds/checks only on PRs targeting main or valid SemVer version tags; no main push or manual dispatch.
  Keep fast PR gates and bounded deeper version-tag checks; no mandatory paid services.
  Read docs/documentation-site-plan.md: English Pages docs via Actions; generator and visual direction still need review.
  The quality planning change did not implement scanners or a site.
  configure-github-app-publication implements tested Node development tooling, Gitleaks/Hadolint/ESLint and a bounded quality workflow.
  Use the installed eneru-soulkiller-agent App (ID 5174172) publication CLI; keys remain ignored and bot commits must be verified.
  Never fall back to the maintainer-authenticated connector for agent publication. The documentation site remains planned.
  English is the working language for specifications, documentation, agent instructions,
  code comments, issue and PR content, and new commit messages.
  Preserve tool-defined identifiers and OpenSpec validation keywords.

rules:
  proposal:
    - Write in English and distinguish confirmed needs, assumptions and exclusions.
  specs:
    - Write requirements and scenarios in English, with observable outcomes and relevant success and failure cases.
  design:
    - Write in English, justify added dependencies and explain their impact on the devcontainer.
  tasks:
    - Write in English and include validation inside the devcontainer and documentation updates.
    - Check off only tasks that have actually been completed and verified.
